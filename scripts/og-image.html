<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>OG Image — Undangan Natal Perkantas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #081a12;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        color: #fdfbf6;
      }
      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #0a1c14 url('/assets-src/ornaments/og-image.png') center / cover no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding-top: 126px;
      }
      .canvas::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 58% 48% at 50% 56%, rgba(5, 18, 12, 0.62), transparent 74%);
      }
      .frame {
        position: absolute;
        inset: 24px;
        border: 1px solid rgba(230, 201, 114, 0.3);
        border-radius: 22px;
      }
      .frame::after {
        content: '';
        position: absolute;
        inset: 9px;
        border: 1px solid rgba(230, 201, 114, 0.12);
        border-radius: 15px;
      }
      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .organizer {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 29px;
        letter-spacing: 0.42em;
        color: #e6c972;
        padding-left: 0.42em;
        text-shadow: 0 2px 16px rgba(4, 16, 10, 0.85);
      }
      .country {
        margin-top: 7px;
        font-size: 12px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(253, 251, 246, 0.6);
        padding-left: 0.34em;
        text-shadow: 0 2px 12px rgba(4, 16, 10, 0.85);
      }
      .eyebrow {
        margin-top: 28px;
        font-size: 13px;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: rgba(230, 201, 114, 0.9);
        padding-left: 0.36em;
      }
      h1 {
        margin: 10px 0 0;
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 500;
        font-size: 72px;
        line-height: 1.08;
        letter-spacing: 0.01em;
        color: #fdfbf6;
        text-shadow: 0 4px 28px rgba(4, 16, 10, 0.9);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 20px;
      }
      .divider span {
        width: 92px;
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(217, 182, 74, 0.8));
      }
      .divider span:last-child {
        background: linear-gradient(to left, transparent, rgba(217, 182, 74, 0.8));
      }
      .immanuel {
        margin-top: 16px;
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: 23px;
        color: rgba(240, 223, 168, 0.94);
        text-shadow: 0 2px 16px rgba(4, 16, 10, 0.85);
      }
      .foot {
        position: absolute;
        bottom: 52px;
        width: 100%;
        z-index: 2;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(253, 251, 246, 0.5);
        text-shadow: 0 2px 12px rgba(4, 16, 10, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame"></div>

      <div class="content">
        <div class="organizer">PERKANTAS</div>
        <div class="country">Perkantas Indonesia</div>

        <div class="eyebrow">Undangan</div>
        <h1>Perayaan Natal</h1>

        <div class="divider">
          <span></span>
          <svg style="width: 12px; height: 12px" viewBox="0 0 24 24" fill="#d9b64a" aria-hidden="true">
            <path d="M12 2.4l2.5 6.1 6.5.5-5 4.3 1.6 6.4L12 16.4 6.4 19.7 8 13.3l-5-4.3 6.5-.5z" />
          </svg>
          <span></span>
        </div>

        <div class="immanuel">Immanuel — Allah beserta kita</div>
      </div>

      <div class="foot">Undangan digital &middot; bersama dalam sukacita Natal</div>
    </div>
  </body>
</html>
